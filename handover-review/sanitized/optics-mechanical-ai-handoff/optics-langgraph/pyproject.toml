[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "optics-langgraph"
version = "0.1.0"
description = "Local LangGraph orchestration for the optics lab"
requires-python = ">=3.12"
dependencies = ["langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4", "pydantic>=2,<3", "jsonschema>=4,<5", "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "rfc8785>=0.1,<1", "openai>=2,<3"]

[project.scripts]
optics-graph = "optics_graph.cli:main"

[tool.setuptools]
packages = ["optics_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
